spring:
  application:
    name: support-ticket-hub

  datasource:
    url: jdbc:mysql://localhost:3306/ticketing_tool?autoReconnect=true&useUnicode=yes&characterEncoding=UTF-8
    username: root
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mvc:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    user:
      name: admin
      password: admin123

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.supportticket: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
